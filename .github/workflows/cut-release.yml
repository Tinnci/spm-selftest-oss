name: Cut Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type (or custom)"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: "Custom semver without 'v' (e.g. 0.1.5 or 0.1.5-rc1, used when bump=custom)"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  actions: write

jobs:
  cut-release:
    name: Bump, Tag & Trigger Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (full history)
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Bump version, commit, tag & trigger release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node - "${{ inputs.bump }}" "${{ inputs.custom_version }}" << 'JSEOF'
          const fs = require("node:fs");
          const [bump, rawCustom] = process.argv.slice(2);
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const curr = pkg.version;
          let next;
          if (bump === "custom") {
            const clean = rawCustom.trim().replace(/^v/, "");
            if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/.test(clean)) {
              throw new Error(`Invalid custom_version: ${rawCustom}`);
            }
            next = clean;
          } else {
            const [maj, min, pat] = curr.split("-")[0].split("+")[0].split(".").map(Number);
            if (bump === "major") next = `${maj + 1}.0.0`;
            else if (bump === "minor") next = `${maj}.${min + 1}.0`;
            else next = `${maj}.${min}.${pat + 1}`;
          }
          pkg.version = next;
          fs.writeFileSync("package.json", `${JSON.stringify(pkg, null, 2)}\n`, "utf8");
          const tauri = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
          tauri.version = next;
          fs.writeFileSync("src-tauri/tauri.conf.json", `${JSON.stringify(tauri, null, 2)}\n`, "utf8");
          const cargo = fs.readFileSync("src-tauri/Cargo.toml", "utf8");
          fs.writeFileSync(
            "src-tauri/Cargo.toml",
            cargo.replace(/^(\[package\][\s\S]*?^version\s*=\s*)"[^"]+"/m, `$1"${next}"`),
            "utf8",
          );
          if (fs.existsSync("src-tauri/Cargo.lock")) {
            const lock = fs.readFileSync("src-tauri/Cargo.lock", "utf8");
            fs.writeFileSync(
              "src-tauri/Cargo.lock",
              lock.replace(/(\[\[package\]\]\s+name = "spm-selftest"\s+version = )"[^"]+"/, `$1"${next}"`),
              "utf8",
            );
          }
          JSEOF
          node scripts/check-versions.mjs
          NEW_VER=$(node -p 'require("./package.json").version')
          NEW_TAG="v${NEW_VER}"
          if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
            echo "::error::Tag $NEW_TAG already exists."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "chore(release): ${NEW_TAG}"
          git push origin HEAD:main
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
          git push origin "$NEW_TAG"
          gh workflow run release.yml --ref "$NEW_TAG"
