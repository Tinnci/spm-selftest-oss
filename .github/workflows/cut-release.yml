name: Cut Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type (or custom)"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: "Custom semver without 'v' (e.g. 0.1.5 or 0.1.5-rc1, used when bump=custom)"
        required: false
        default: ""
        type: string

concurrency:
  group: cut-release-main
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  cut-release:
    name: Bump, Tag & Trigger Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (full history)
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Bump version, commit, tag & trigger release
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
          CUSTOM_VERSION: ${{ inputs.custom_version }}
        run: |
          npm run check:versions
          NEW_VER="$(node scripts/bump-release.mjs "$BUMP" "$CUSTOM_VERSION")"
          npm run check:versions
          NEW_TAG="v${NEW_VER}"
          if git show-ref --verify --quiet "refs/tags/$NEW_TAG"; then
            echo "::error::Tag $NEW_TAG already exists."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "chore(release): ${NEW_TAG}"
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$NEW_TAG"
          gh workflow run release.yml --ref "$NEW_TAG"
