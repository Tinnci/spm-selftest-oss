name: Desktop Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for retrying from main)
        required: false
        type: string

concurrency:
  group: desktop-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org
  NPM_CONFIG_REPLACE_REGISTRY_HOST: always
  VITE_ENABLE_UPDATER: '1'

jobs:
  frontend:
    name: Build release frontend
    if: github.ref_type == 'tag' || (github.ref == 'refs/heads/main' && inputs.tag != '')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Select and validate the tag
        id: tag
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$REQUESTED_TAG"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*)?$ ]]; then
            echo "::error::Expected a desktop release tag such as v0.1.5."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: refs/tags/${{ steps.tag.outputs.tag }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Verify tag matches the application version
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          npm run check:versions
          version="$(node -p 'require("./package.json").version')"
          test "$RELEASE_TAG" = "v$version"

      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: release-frontend-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  draft:
    name: Prepare draft release
    needs: frontend
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.draft.outputs.release-id }}
      tag: ${{ needs.frontend.outputs.tag }}
    steps:
      - name: Create or reuse draft
        id: draft
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.frontend.outputs.tag }}
        run: |
          release="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" |
            jq -r --arg tag "$RELEASE_TAG" '.[] | select(.tag_name == $tag) | [.id, .draft] | @tsv')"
          if [[ "$release" == *$'\tfalse' ]]; then
            echo "::error::Release $RELEASE_TAG is already published."
            exit 1
          fi
          if [[ -n "$release" ]]; then
            release_id="${release%%$'\t'*}"
          else
            prerelease=false
            if [[ "$RELEASE_TAG" == *-* ]]; then prerelease=true; fi
            release_id="$(gh api --method POST "repos/$GH_REPO/releases" \
              -f tag_name="$RELEASE_TAG" -f name="SPM Self-Test $RELEASE_TAG" \
              -F draft=true -F prerelease="$prerelease" -F generate_release_notes=true --jq '.id')"
          fi
          if [[ ! "$release_id" =~ ^[0-9]+$ ]]; then
            echo "::error::Missing draft ID for $RELEASE_TAG."
            exit 1
          fi
          echo "release-id=$release_id" >> "$GITHUB_OUTPUT"

  build:
    name: Signed desktop bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: draft
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
            arch_label: windows-x86_64
            runner_arch: X64
          - os: windows-11-arm
            bundle: nsis
            arch_label: windows-aarch64
            runner_arch: ARM64
          - os: ubuntu-22.04
            bundle: appimage
            arch_label: linux-x86_64
            runner_arch: X64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: refs/tags/${{ needs.draft.outputs.tag }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: release-frontend-dist
          path: dist/

      - name: Verify runner architecture
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.runner_arch }}
        run: test "$RUNNER_ARCH" = "$EXPECTED_ARCH"

      - if: runner.os == 'Linux'
        name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: tauri-release-${{ matrix.arch_label }}

      - run: npm ci

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.draft.outputs.release-id }}
          uploadUpdaterJson: false
          args: >-
            --config src-tauri/tauri.release.conf.json
            --config src-tauri/tauri.prebuilt.conf.json
            --bundles ${{ matrix.bundle }}
            -- --locked

      - name: Upload Windows portable EXE, ZIP and checksum
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          ARCH_LABEL: ${{ matrix.arch_label }}
          RELEASE_TAG: ${{ needs.draft.outputs.tag }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $name = "SPM-SelfTest-$version-$env:ARCH_LABEL"
          $bundleDir = Join-Path $env:RUNNER_TEMP "$name-bundle"
          $portable = Join-Path $env:RUNNER_TEMP "$name.exe"
          $portableSig = "$portable.sig"
          $zip = Join-Path $env:RUNNER_TEMP "$name.zip"
          $checksum = Join-Path $env:RUNNER_TEMP "$name.sha256"
          $target = "src-tauri/target/release"
          if (-not (Test-Path "$target/spm-selftest-cli.exe")) {
            cargo build --release --locked --manifest-path src-tauri/Cargo.toml --bin spm-selftest-cli
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          New-Item -ItemType Directory -Path $bundleDir | Out-Null
          Copy-Item "$target/spm-selftest.exe", "$target/spm-selftest-cli.exe", "docs/WINDOWS.md", LICENSE, NOTICE $bundleDir
          Copy-Item "$target/spm-selftest.exe" $portable
          npx tauri signer sign $portable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -LiteralPath $bundleDir -DestinationPath $zip -CompressionLevel Fastest
          $sha = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          Set-Content -Path $checksum -Value "$sha  $name.zip"
          gh release upload "$env:RELEASE_TAG" $portable $portableSig $zip $checksum --clobber

  manifest:
    name: Verify assets and publish
    needs: [draft, build]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: refs/tags/${{ needs.draft.outputs.tag }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Generate updater manifest and publish
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.draft.outputs.release-id }}
          RELEASE_TAG: ${{ needs.draft.outputs.tag }}
        run: |
          manifest_dir="$(mktemp -d)"
          gh api "repos/$GH_REPO/releases/$RELEASE_ID/assets?per_page=100" > "$manifest_dir/assets.json"
          gh release download "$RELEASE_TAG" --pattern '*.sig' --dir "$manifest_dir"
          node scripts/prepare-update-manifest.mjs "$manifest_dir/latest.json" "$manifest_dir/assets.json" "$GH_REPO" "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" "$manifest_dir/latest.json" --clobber
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi
