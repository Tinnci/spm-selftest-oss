name: Desktop Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org
  NPM_CONFIG_REPLACE_REGISTRY_HOST: always
  VITE_ENABLE_UPDATER: '1'

jobs:
  frontend:
    name: Build release frontend
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Verify tag matches the application version
        shell: bash
        run: |
          npm run check:versions
          version="$(node -p 'require("./package.json").version')"
          test "$GITHUB_REF_NAME" = "v$version"

      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: release-frontend-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  draft:
    name: Prepare draft release
    needs: frontend
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.draft.outputs.release-id }}
    steps:
      - name: Create or reuse draft
        id: draft
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          draft="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.tag_name == env.GITHUB_REF_NAME) | [.id, .draft] | @tsv')"
          if [[ "$draft" == *$'\tfalse' ]]; then
            echo "::error::Release $GITHUB_REF_NAME is already published."
            exit 1
          fi
          if [[ -n "$draft" ]]; then
            release_id="${draft%%$'\t'*}"
          else
            flags=()
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
              --generate-notes --title "SPM Self-Test $GITHUB_REF_NAME" "${flags[@]}"
            release_id="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.tag_name == env.GITHUB_REF_NAME and .draft) | .id')"
          fi
          [[ "$release_id" =~ ^[0-9]+$ ]]
          echo "release-id=$release_id" >> "$GITHUB_OUTPUT"

  build:
    name: Signed desktop bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: draft
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
            arch_label: windows-x86_64
            runner_arch: X64
          - os: windows-11-arm
            bundle: nsis
            arch_label: windows-aarch64
            runner_arch: ARM64
          - os: ubuntu-22.04
            bundle: appimage
            arch_label: linux-x86_64
            runner_arch: X64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: release-frontend-dist
          path: dist/

      - name: Verify runner architecture
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.runner_arch }}
        run: test "$RUNNER_ARCH" = "$EXPECTED_ARCH"

      - if: runner.os == 'Linux'
        name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: tauri-release-${{ matrix.arch_label }}

      - run: npm ci

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.draft.outputs.release-id }}
          uploadUpdaterJson: false
          args: >-
            --config src-tauri/tauri.release.conf.json
            --config src-tauri/tauri.prebuilt.conf.json
            --bundles ${{ matrix.bundle }}
            -- --locked

      - name: Upload Windows portable EXE, ZIP and checksum
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          ARCH_LABEL: ${{ matrix.arch_label }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $name = "SPM-SelfTest-$version-$env:ARCH_LABEL"
          $bundleDir = Join-Path $env:RUNNER_TEMP "$name-bundle"
          $portable = Join-Path $env:RUNNER_TEMP "$name.exe"
          $zip = Join-Path $env:RUNNER_TEMP "$name.zip"
          $checksum = Join-Path $env:RUNNER_TEMP "$name.sha256"
          $target = "src-tauri/target/release"
          if (-not (Test-Path "$target/spm-selftest-cli.exe")) {
            cargo build --release --locked --manifest-path src-tauri/Cargo.toml --bin spm-selftest-cli
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          New-Item -ItemType Directory -Path $bundleDir | Out-Null
          Copy-Item "$target/spm-selftest.exe", "$target/spm-selftest-cli.exe", "docs/WINDOWS.md", LICENSE, NOTICE $bundleDir
          Copy-Item "$target/spm-selftest.exe" $portable
          Compress-Archive -LiteralPath $bundleDir -DestinationPath $zip -CompressionLevel Fastest
          $sha = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          Set-Content -Path $checksum -Value "$sha  $name.zip"
          gh release upload "$env:GITHUB_REF_NAME" $portable $zip $checksum --clobber

  manifest:
    name: Verify assets and publish
    needs: [draft, build]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Generate updater manifest and publish
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.draft.outputs.release-id }}
        run: |
          manifest_dir="$(mktemp -d)"
          gh api "repos/$GH_REPO/releases/$RELEASE_ID/assets?per_page=100" > "$manifest_dir/assets.json"
          gh release download "$GITHUB_REF_NAME" --pattern '*.sig' --dir "$manifest_dir"
          node scripts/prepare-update-manifest.mjs "$manifest_dir/latest.json" "$manifest_dir/assets.json" "$GH_REPO" "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" "$manifest_dir/latest.json" --clobber
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease --latest=false
          else
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          fi
