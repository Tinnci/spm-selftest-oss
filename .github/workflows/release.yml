name: Desktop Release

on:
  push:
    tags: ['v*']

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org
  NPM_CONFIG_REPLACE_REGISTRY_HOST: always
  VITE_ENABLE_UPDATER: '1'

jobs:
  frontend:
    name: Build release frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Verify tag matches the application version
        shell: bash
        run: |
          npm run check:versions
          version="$(node -p 'require("./package.json").version')"
          test "$GITHUB_REF_NAME" = "v$version"

      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: release-frontend-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  build:
    name: Signed desktop bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
          - os: ubuntu-22.04
            bundle: appimage
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: release-frontend-dist
          path: dist/

      - if: runner.os == 'Linux'
        name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: tauri-release-${{ runner.os }}

      - run: npm ci

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: SPM Self-Test ${{ github.ref_name }}
          releaseBody: Windows x64 NSIS and Linux x86_64 AppImage.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: >-
            --config src-tauri/tauri.release.conf.json
            --config src-tauri/tauri.prebuilt.conf.json
            --bundles ${{ matrix.bundle }}
            -- --locked

      - name: Upload Windows portable EXE, ZIP and checksum
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $name = "SPM-SelfTest-$version-windows-x86_64"
          $bundleDir = Join-Path $env:RUNNER_TEMP "$name-bundle"
          $portable = Join-Path $env:RUNNER_TEMP "$name.exe"
          $zip = Join-Path $env:RUNNER_TEMP "$name.zip"
          $checksum = Join-Path $env:RUNNER_TEMP "$name.sha256"
          $target = "src-tauri/target/release"
          if (-not (Test-Path "$target/spm-selftest-cli.exe")) {
            cargo build --release --locked --manifest-path src-tauri/Cargo.toml --bin spm-selftest-cli
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          New-Item -ItemType Directory -Path $bundleDir | Out-Null
          Copy-Item "$target/spm-selftest.exe", "$target/spm-selftest-cli.exe", "docs/WINDOWS.md", LICENSE, NOTICE $bundleDir
          Copy-Item "$target/spm-selftest.exe" $portable
          Compress-Archive -LiteralPath $bundleDir -DestinationPath $zip -CompressionLevel Fastest
          $sha = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          Set-Content -Path $checksum -Value "$sha  $name.zip"
          gh release upload "$env:GITHUB_REF_NAME" $portable $zip $checksum --clobber

  manifest:
    name: Validate updater manifest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Verify both targets and set public asset URLs
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          manifest_dir="$(mktemp -d)"
          gh release download "$GITHUB_REF_NAME" --pattern latest.json --dir "$manifest_dir"
          gh api "repos/$GH_REPO/releases" | jq --arg tag "$GITHUB_REF_NAME" '.[] | select(.tag_name == $tag) | .assets' > "$manifest_dir/assets.json"
          node scripts/prepare-update-manifest.mjs "$manifest_dir/latest.json" "$manifest_dir/assets.json" "$GH_REPO" "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" "$manifest_dir/latest.json" --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
