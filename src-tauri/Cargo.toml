[package]
name = "spm-selftest"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
description = "Standalone Android device self-test collector extracted from Maon"
default-run = "spm-selftest"

[workspace]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.5.5", features = [] }

[dependencies]
clap = { version = "4", features = ["derive"] }
encoding_rs = "0.8"
rust_xlsxwriter = "0.103"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
tokio = { version = "1", features = ["process", "time", "sync", "rt", "macros", "net"] }
tauri = { version = "2.11.6", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2"
regex = "1"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }

[profile.release]
panic = "abort"
debug = 0
strip = "symbols"
incremental = false

[profile.dev]
opt-level = 0
debug = 0
incremental = true

[profile.dev.package."*"]
opt-level = 1

[profile.test]
opt-level = 0
debug = 0
incremental = true

[profile.test.package."*"]
opt-level = 1
